<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふうりんの作り方ガイド</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css?v=20260731-3">
<link rel="stylesheet" href="section-status.css?v=20260731-1">
</head>
<body>
<header class="app-header">
  <h1>🎐 ふうりんの作り方ガイド</h1>
  <p class="subtitle">8月度 親子工作</p>
</header>

<main class="viewer">
  <div class="progress-wrap">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <p id="progressLabel" class="progress-label"></p>
  </div>

  <div class="viewer-tools">
    <button id="tocBtn" class="toc-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
      ☰ 目次
    </button>
    <div class="current-section" role="status" aria-live="polite" aria-atomic="true">
      <span class="current-section-prefix">現在の工程</span>
      <strong id="currentSectionLabel">作り方の目次</strong>
    </div>
  </div>

  <div class="step-card">
    <div id="imageStage" class="image-stage">
      <img id="stepImage" class="step-image" src="" alt="作り方の写真">
      <p id="imageStatus" class="image-status" role="status" aria-live="polite" hidden></p>
    </div>
    <div class="step-info">
      <p id="stepBadge" class="step-badge"></p>
      <p id="stepText" class="step-text"></p>
    </div>
  </div>

  <nav class="nav-buttons" aria-label="手順の移動">
    <button id="prevBtn" class="nav-btn" type="button">← 前へ</button>
    <button id="nextBtn" class="nav-btn" type="button">次へ →</button>
  </nav>

  <div id="qrBlock" class="qr-block">
    <img src="qrcode.png" alt="サイトのQRコード" class="qr-image">
    <p class="qr-caption">スマホでスキャンしてすぐ開けます</p>
  </div>
</main>

<div id="tocModal" class="toc-modal" hidden>
  <button class="toc-backdrop" type="button" data-toc-close aria-label="目次を閉じる"></button>
  <section class="toc-panel" role="dialog" aria-modal="true" aria-labelledby="tocTitle">
    <div class="toc-header">
      <div>
        <p class="toc-kicker">全6工程</p>
        <h2 id="tocTitle">作り方の目次</h2>
      </div>
      <button id="tocCloseBtn" class="toc-close" type="button" aria-label="目次を閉じる">×</button>
    </div>
    <p class="toc-intro">見たい工程を選ぶと、その工程の最初の手順へ移動します。</p>
    <div id="tocList" class="toc-list"></div>
  </section>
</div>

<script src="script.js?v=20260731-3"></script>
<script src="section-status.js?v=20260731-1"></script>
</body>
</html>
