<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd4e6"/>
      <stop offset="1" stop-color="#eaf9fc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- hanging string -->
  <line x1="32" y1="6" x2="32" y2="15" stroke="#17505f" stroke-width="2" stroke-linecap="round"/>

  <!-- bell -->
  <path d="M18 30 a14 14 0 0 1 28 0 z" fill="#ffd85e" stroke="#17505f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M16 30 h32 l-3 6 h-26 z" fill="#f5b301" stroke="#17505f" stroke-width="2" stroke-linejoin="round"/>

  <!-- clapper string -->
  <line x1="32" y1="36" x2="32" y2="44" stroke="#17505f" stroke-width="2"/>

  <!-- tanzaku strip -->
  <rect x="26" y="44" width="12" height="16" rx="2" fill="#ffffff" stroke="#17505f" stroke-width="2"/>
  <line x1="29" y1="49" x2="35" y2="49" stroke="#7fd4e6" stroke-width="1.5"/>
  <line x1="29" y1="53" x2="35" y2="53" stroke="#7fd4e6" stroke-width="1.5"/>
</svg>
